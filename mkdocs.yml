site_name: Kotlin Book
site_url: https://kotlin-book.vercel.app
theme:
  name: materialx
  language: zh-Hant
  palette:
      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: indigo
        accent: indigo
        toggle:
          icon: material/brightness-7
          name: 切換至深色模式

      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: purple
        accent: purple
        toggle:
          icon: material/brightness-4
          name: 切換至淺色模式
  features:
    # === 導航功能 ===
    - navigation.expand    # 自動展開導航項
    - navigation.top       # 顯示返回頂部按鈕
    - navigation.footer    # 顯示頁腳導航
    - toc.follow          # 目錄跟隨滾動

    # === 搜尋功能 ===
    - search.highlight    # 搜尋結果高亮顯示
    - search.share       # 可分享搜尋結果
    - search.suggest     # 搜尋建議

    # === 內容功能 ===
    - content.code.copy   # 程式碼區塊可複製
    - content.tabs.link   # 分頁內容可連結

    # === 進階功能 ===
    - navigation.tracking # 跟蹤導航位置
    - navigation.instant  # 即時頁面切換
    - header.autohide     # 滾動時自動隱藏頁首
    - announce.dismiss    # 可關閉公告

markdown_extensions:
    - tables
    - attr_list
    - md_in_html
    - footnotes
    - def_list
    - pymdownx.highlight:
        anchor_linenums: true
        use_pygments: true
    - pymdownx.superfences:
          custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
    - admonition
    - pymdownx.details
    - pymdownx.tabbed:
        alternate_style: true
    - pymdownx.tasklist:
        custom_checkbox: true
    - toc:
        permalink: "#"
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.snippets
    - pymdownx.inlinehilite

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

plugins:
  - search:
      lang: zh

nav:
  - 網站簡介: index.md
  - 環境架設與基礎介紹: courses/environment/main.md
  - Kotlin 基礎: courses/kotlin/basic.md
  - 迴圈與陣列: courses/kotlin/loop.md
  - 函式與 lambda: courses/function/basic.md
  - 遞迴: courses/function/recursive.md
  - 時間複雜度排序與二分搜尋法: courses/timeComplexityAndSort/main.md
  - 常用擴充函式: courses/standardUsefulUtilities/function.md
  - 常用資料結構: courses/standardUsefulUtilities/data-structure.md
  - 常見基礎演算法:
      - 靜態區間操作: courses/BasicAlgo/static-range.md
      - 掃描線: courses/BasicAlgo/scan-line.md
      - 雙指針: courses/BasicAlgo/two-pointer.md
  - 貪心法: courses/greedy/main.md
  - 動態規劃: courses/dp/basic.md
  - 圖論基礎: courses/graph/basic.md
  # - 數論: todo.md
  # - 區間查詢資料結構: todo.md
